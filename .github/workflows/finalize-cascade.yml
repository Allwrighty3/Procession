name: Finalize Cascade Evidence

on:
  push:
    branches:
      - agent/cascading-regional-change

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize cascading evidence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cascading-regional-change
      - name: Fix metric and remove temporary evidence test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/procession/simulation/cascading_regional_change_experiment.ex')
          text = source.read_text()
          old = '''      distinct_regions_entered:
        traces |> Enum.flat_map(& &1.location_changes) |> Enum.map(& &1.to)
        |> Enum.reject(&match?({:transit, _, _, _}, &1)) |> Enum.uniq() |> length()
'''
          new = '''      distinct_regions_entered:
        traces
        |> Enum.flat_map(& &1.location_changes)
        |> Enum.map(& &1.to)
        |> Enum.filter(&(&1 in @regions))
        |> Enum.uniq()
        |> length()
'''
          if old not in text:
              raise SystemExit('distinct region metric block not found')
          source.write_text(text.replace(old, new))

          Path('test/procession/simulation/cascading_regional_change_metrics_run_test.exs').unlink(missing_ok=True)
          Path('.github/workflows/finalize-cascade.yml').unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize cascading evidence"
          git push origin HEAD:agent/cascading-regional-change
