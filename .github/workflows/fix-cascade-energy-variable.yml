name: Fix Cascade Energy Variable

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/cascading-regional-change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cascading-regional-change
      - name: Apply fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/procession/simulation/cascading_regional_change_experiment.ex')
          s = p.read_text()
          s = s.replace('fn [before, after], {down, up} ->', 'fn [before, later], {down, up} ->')
          s = s.replace('Enum.reduce(after.commitments, {down, up}', 'Enum.reduce(later.commitments, {down, up}')
          p.write_text(s)
          Path('.github/workflows/cascade-compile-tail.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-cascade-energy-variable.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix cascade energy comparison variable"
          git push origin HEAD:agent/cascading-regional-change
