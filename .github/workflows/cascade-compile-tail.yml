name: Cascade Compile Tail

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    if: github.head_ref == 'agent/cascading-regional-change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.3'
      - run: mix deps.get
      - name: Capture compile
        run: |
          set +e
          mix compile --warnings-as-errors > cascade-tail.txt 2>&1
          tail -120 cascade-tail.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cascade-tail
          path: cascade-tail.txt
