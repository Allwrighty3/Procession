name: Fix Held Transfer Signature

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/finish-interpersonal-and-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-interpersonal-and-transfer
      - name: Fix signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/procession/simulation/causal_world_kernel.ex')
          text = p.read_text()
          text = text.replace('  @spec transfer_held_resource(t(), term(), term(), number(), keyword()) :: {t(), map()}\n        when t: %__MODULE__{}\n', '')
          text = text.replace('requested, opts \\ [])', 'requested, opts \\\\ [])')
          p.write_text(text)
          PY
          rm -f .github/workflows/fix-held-transfer-signature.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib .github/workflows
          git commit -m "Fix held transfer function signature"
          git push origin HEAD:agent/finish-interpersonal-and-transfer
