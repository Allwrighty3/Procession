name: Fix Cascade Route Options

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/cascading-regional-change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cascading-regional-change
      - name: Apply route option fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/procession/simulation/cascading_regional_change_experiment.ex')
          s = p.read_text()
          old = '''      route_opts: %{
        travel_energy_decay: 0.004 + clamp(pressure, 0.0, 1.5) * 0.006,
        route_pressure: clamp(pressure, 0.0, 1.5),
        travel_demand: 0.01 + clamp(pressure, 0.0, 1.5) * 0.015
      }
'''
          new = '''      route_opts: [
        travel_energy_decay: 0.004 + clamp(pressure, 0.0, 1.5) * 0.006,
        route_pressure: clamp(pressure, 0.0, 1.5),
        travel_demand: 0.01 + clamp(pressure, 0.0, 1.5) * 0.015
      ]
'''
          if old not in s:
              raise SystemExit('route options block not found')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/cascade-trace.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-cascade-route-opts.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Use valid cascading route options"
          git push origin HEAD:agent/cascading-regional-change
