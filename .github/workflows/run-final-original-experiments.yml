name: Final Original Task Experiments

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  metrics:
    if: github.head_ref == 'agent/finish-interpersonal-and-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18.3"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Run experiments
        shell: bash
        run: |
          set -o pipefail
          {
            for seed in 19 41 77; do
              echo "=== INTERPERSONAL CONTROLS seed=$seed ==="
              mix procession.metrics.local_interpersonal_controls --cycles 96 --seed "$seed"
            done
            echo '=== HELD TRANSFER normal ==='
            mix procession.metrics.held_resource_transfer --requested 0.2 --limit 0.12
            echo '=== HELD TRANSFER inventory-limited ==='
            mix procession.metrics.held_resource_transfer --requested 0.5 --limit 1.0
            echo '=== HELD TRANSFER zero-request ==='
            mix procession.metrics.held_resource_transfer --requested 0.0 --limit 0.12
          } 2>&1 | tee final-original-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-original-results
          path: final-original-results.txt
