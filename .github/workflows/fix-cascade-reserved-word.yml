name: Fix Cascade Reserved Word

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/cascading-regional-change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cascading-regional-change
      - name: Apply syntax fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/procession/simulation/cascading_regional_change_experiment.ex')
          s = p.read_text()
          s = s.replace('fn [before, changed, after] ->', 'fn [before, changed, later] ->')
          s = s.replace('changed.regional[region].last_production != after.regional[region].last_production', 'changed.regional[region].last_production != later.regional[region].last_production')
          s = s.replace('changed.regional[region].regional_support != after.regional[region].regional_support', 'changed.regional[region].regional_support != later.regional[region].regional_support')
          p.write_text(s)
          Path('.github/workflows/cascade-diagnostic.yml').unlink(missing_ok=True)
          Path('.github/workflows/fix-cascade-reserved-word.yml').unlink(missing_ok=True)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix cascading experiment syntax"
          git push origin HEAD:agent/cascading-regional-change
