name: Cascade Failure Trace

on:
  pull_request:
    branches: [main]

jobs:
  trace:
    if: github.head_ref == 'agent/cascading-regional-change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18.3'
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Run short trace
        run: mix procession.metrics.cascading_regional_change --ticks 3 --budget 3 --cadence 1 --seed 41 > cascade-trace.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: cascade-trace
          path: cascade-trace.txt
