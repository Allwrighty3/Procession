name: Apply Transit Exhaustion Recovery

on:
  push:
    branches:
      - agent/persistent-transit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[transit-recovery]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-transit
          fetch-depth: 0
      - name: Patch exhaustion recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/procession/simulation/living_briar_runtime.ex')
          text = path.read_text()
          text = text.replace('energy = clamp(body.energy - 0.018, 0.0, 1.0)',
                              'energy = clamp(body.energy - 0.012, 0.0, 1.0)', 1)
          old = '''    energy <= 0.0 and progress < extent ->
      {regions, updated_process, :stranded,
       physical_consequence(:transit_stranded, 0.0, -0.2)}'''
          new = '''    energy <= 0.0 and progress < extent ->
      source =
        CognitiveMaterialKernel.put_resident(
          regions[source_region],
          %{body | position: transit_departure_position(process.action.direction)}
        )

      {Map.put(regions, source_region, source), updated_process, :ended,
       physical_consequence(:transit_exhausted, 0.0, -0.2)}'''
          if old not in text:
              raise SystemExit('transit exhaustion branch not found')
          text = text.replace(old, new, 1)
          anchor = '''  defp transit_entry_position(:east), do: {-2, 0}
  defp transit_entry_position(:west), do: {2, 0}
  defp transit_entry_position(_), do: {0, 0}'''
          replacement = anchor + '''
  defp transit_departure_position(:east), do: {2, 0}
  defp transit_departure_position(:west), do: {-2, 0}
  defp transit_departure_position(_), do: {0, 0}'''
          if anchor not in text:
              raise SystemExit('transit entry helpers not found')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Return exhausted travelers to source boundary [transit-recovery]'
          git push origin HEAD:agent/persistent-transit
