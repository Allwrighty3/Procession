name: Apply Persistent Transit

on:
  push:
    branches:
      - agent/persistent-transit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[transit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-transit
          fetch-depth: 0
      - name: Patch runtime and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/procession/simulation/living_briar_runtime.ex')
          text = path.read_text()

          text = text.replace(
          '''    :contact_body,
              :move_local
            ]''',
          '''    :contact_body,
              :move_local,
              :cross_region_boundary
            ]''', 1)

          text = text.replace(
          'advance_resident_processes(replenished_regions, state.resident_processes, tick)',
          'advance_resident_processes(replenished_regions, state.resident_processes, tick, state)', 1)

          text = text.replace(
          'migrations: Enum.count(successful, & &1.moved?),',
          '''migrations:
                 Enum.count(successful, & &1.moved?) +
                   Enum.count(process_events, &(&1.status == :arrived)),''', 1)

          text = text.replace(
          '''       resident_process_endings: Enum.count(process_events, &(&1.status == :ended)),
                 material_accounting_error:
                   total_material(state.regions) + player_material(state.player_body) -
                     (state.initial_total + replenished),''',
          '''       resident_process_endings: Enum.count(process_events, &(&1.status == :ended)),
                 transit_starts:
                   Enum.count(process_events, &(&1.primitive == :cross_region_boundary and &1.status == :started)),
                 transit_progress:
                   Enum.count(process_events, &(&1.primitive == :cross_region_boundary and &1.status == :continuing)),
                 transit_arrivals:
                   Enum.count(process_events, &(&1.primitive == :cross_region_boundary and &1.status == :arrived)),
                 transit_stranded:
                   Enum.count(process_events, &(&1.primitive == :cross_region_boundary and &1.status == :stranded)),
                 material_accounting_error:
                   total_material(state.regions) + transit_material(state.resident_processes) +
                     player_material(state.player_body) - (state.initial_total + replenished),''', 1)

          start = text.index('  defp advance_resident_processes(')
          end = text.index('  defp advance_physical_process(', start)
          replacement = '''  defp advance_resident_processes(regions, processes, tick, state) do
            processes
            |> Enum.sort_by(fn {identity_id, _process} -> identity_id end)
            |> Enum.reduce({regions, %{}, []}, fn {identity_id, process},
                                                {current_regions, next_processes, events} ->
              if process.primitive == :cross_region_boundary do
                {updated_regions, updated_process, status, consequence} =
                  advance_transit_process(current_regions, identity_id, process, state)

                event =
                  process_event(
                    identity_id,
                    updated_process,
                    status,
                    tick,
                    consequence.amount,
                    consequence.kind
                  )

                next_processes =
                  if status in [:continuing, :stranded] do
                    Map.put(next_processes, identity_id, updated_process)
                  else
                    next_processes
                  end

                {updated_regions, next_processes, [event | events]}
              else
                case Map.get(locations(current_regions), identity_id) do
                  nil ->
                    event =
                      process_event(identity_id, process, :interrupted, tick, 0.0, :identity_absent)

                    {current_regions, next_processes, [event | events]}

                  region_id ->
                    {updated_regions, consequence} =
                      advance_physical_process(current_regions, region_id, identity_id, process)

                    accumulated = process.accumulated + consequence.amount
                    updated_process = %{process | region_id: region_id, accumulated: accumulated}

                    if process_can_continue?(updated_regions, identity_id, updated_process, consequence) do
                      event =
                        process_event(
                          identity_id,
                          updated_process,
                          :continuing,
                          tick,
                          consequence.amount,
                          consequence.kind
                        )

                      {
                        updated_regions,
                        Map.put(next_processes, identity_id, updated_process),
                        [event | events]
                      }
                    else
                      event =
                        process_event(
                          identity_id,
                          updated_process,
                          :ended,
                          tick,
                          consequence.amount,
                          consequence.kind
                        )

                      {updated_regions, next_processes, [event | events]}
                    end
                end
              end
            end)
            |> then(fn {next_regions, next_processes, events} ->
              {next_regions, next_processes, Enum.reverse(events)}
            end)
          end

          defp advance_transit_process(regions, identity_id, process, state) do
            source_region = process.region_id
            destination_region = process.action.region_id
            extent = Map.get(process, :extent, transit_extent(source_region, destination_region))

            {body, regions} =
              case Map.get(process, :body) do
                nil ->
                  {resident, source} =
                    CognitiveMaterialKernel.remove_resident(regions[source_region], identity_id)

                  {resident, Map.put(regions, source_region, source)}

                resident ->
                  {resident, regions}
              end

            energy = clamp(body.energy - 0.018, 0.0, 1.0)
            body = %{body | energy: energy}
            progress = process.accumulated + if(energy > 0.0, do: 1.0, else: 0.0)

            updated_process =
              process
              |> Map.put(:body, body)
              |> Map.put(:extent, extent)
              |> Map.put(:accumulated, progress)

            cond do
              energy <= 0.0 and progress < extent ->
                {regions, updated_process, :stranded,
                 physical_consequence(:transit_stranded, 0.0, -0.2)}

              progress < extent ->
                {regions, updated_process, :continuing,
                 physical_consequence(:advanced_in_transit, 1.0, 0.1)}

              true ->
                case RegionActivationLifecycle.migrate(
                       identity_id,
                       source_region,
                       destination_region,
                       [],
                       state.lifecycle
                     ) do
                  {:ok, _} ->
                    target =
                      CognitiveMaterialKernel.put_resident(
                        regions[destination_region],
                        %{body | position: transit_entry_position(process.action.direction)}
                      )

                    {Map.put(regions, destination_region, target), updated_process, :arrived,
                     physical_consequence(:crossed_region_boundary, 1.0, 0.2)}

                  {:error, _} ->
                    source = CognitiveMaterialKernel.put_resident(regions[source_region], body)

                    {Map.put(regions, source_region, source), updated_process, :ended,
                     physical_consequence(:boundary_crossing_rejected, 0.0, -0.1)}
                end
            end
          end

          '''
          text = text[:start] + replacement + text[end:]

          old_execute_start = text.index('  defp execute(\n         regions,\n         region_id,\n         identity_id,\n         %{primitive: :cross_region_boundary')
          old_execute_end = text.index('  defp execute(regions, region_id, identity_id, action, _state)', old_execute_start)
          text = text[:old_execute_start] + text[old_execute_end:]

          text = text.replace(
          '''  defp process_event(identity_id, process, status, tick, amount, consequence),
              do: %{
                identity: identity_id,
                primitive: process.primitive,
                region: process.region_id,
                status: status,
                tick: tick,
                amount: amount,
                accumulated: process.accumulated,
                consequence: consequence
              }''',
          '''  defp process_event(identity_id, process, status, tick, amount, consequence) do
            %{
              identity: identity_id,
              primitive: process.primitive,
              region: process.region_id,
              destination_region: get_in(process, [:action, :region_id]),
              status: status,
              tick: tick,
              amount: amount,
              accumulated: process.accumulated,
              extent: Map.get(process, :extent),
              energy: get_in(process, [:body, :energy]),
              consequence: consequence
            }
          end''', 1)

          text = text.replace(
          '''  defp player_material(nil), do: 0.0
            defp player_material(body), do: body.raw + body.usable + body.consumed''',
          '''  defp player_material(nil), do: 0.0
            defp player_material(body), do: body.raw + body.usable + body.consumed

            defp transit_material(processes) do
              processes
              |> Map.values()
              |> Enum.map(fn process ->
                case Map.get(process, :body) do
                  nil -> 0.0
                  body -> body.raw + body.usable
                end
              end)
              |> Enum.sum()
            end

            defp transit_extent(:west_fields, :crossroads), do: 3.0
            defp transit_extent(:crossroads, :west_fields), do: 3.0
            defp transit_extent(:crossroads, :east_refuge), do: 4.0
            defp transit_extent(:east_refuge, :crossroads), do: 4.0
            defp transit_extent(_from, _to), do: 3.0
            defp transit_entry_position(:east), do: {-2, 0}
            defp transit_entry_position(:west), do: {2, 0}
            defp transit_entry_position(_), do: {0, 0}''', 1)

          path.write_text(text)

          test = Path('test/procession/simulation/persistent_transit_test.exs')
          test.write_text('''defmodule Procession.Simulation.PersistentTransitTest do
            use ExUnit.Case, async: false

            alias Procession.Simulation.LivingBriarRuntime

            test "boundary crossing leaves regional contact and arrives after route progress" do
              {:ok, runtime} = LivingBriarRuntime.start_link(seed: 41, budget: 0, cadence: 8)

              :sys.replace_state(runtime, fn state ->
                process = %{
                  primitive: :cross_region_boundary,
                  action: %{primitive: :cross_region_boundary, direction: :east, region_id: :east_refuge},
                  region_id: :crossroads,
                  started_tick: 0,
                  accumulated: 0.0
                }

                %{state | resident_processes: %{"mara" => process}}
              end)

              assert LivingBriarRuntime.snapshot(runtime).populations.crossroads == 1

              assert {:ok, first} = LivingBriarRuntime.step(runtime)
              assert first.populations.crossroads == 0
              assert first.populations.east_refuge == 2
              assert first.resident_processes["mara"].accumulated == 1.0
              assert [%{identity: "mara", status: :continuing}] = first.resident_process_events

              assert {:ok, _} = LivingBriarRuntime.step(runtime)
              assert {:ok, _} = LivingBriarRuntime.step(runtime)
              assert {:ok, arrival} = LivingBriarRuntime.step(runtime)

              assert arrival.populations.crossroads == 0
              assert arrival.populations.east_refuge == 3
              assert arrival.resident_processes == %{}
              assert [%{identity: "mara", status: :arrived, consequence: :crossed_region_boundary}] =
                       arrival.resident_process_events

              summary = LivingBriarRuntime.snapshot(runtime)
              assert summary.transit_starts == 0
              assert summary.transit_progress == 3
              assert summary.transit_arrivals == 1
              assert summary.migrations == 1
              assert abs(summary.material_accounting_error) < 1.0e-8

              LivingBriarRuntime.stop(runtime)
            end

            test "transit body remains conserved while outside every region" do
              {:ok, runtime} = LivingBriarRuntime.start_link(seed: 41, budget: 0, cadence: 8)

              :sys.replace_state(runtime, fn state ->
                process = %{
                  primitive: :cross_region_boundary,
                  action: %{primitive: :cross_region_boundary, direction: :west, region_id: :west_fields},
                  region_id: :crossroads,
                  started_tick: 0,
                  accumulated: 0.0
                }

                %{state | resident_processes: %{"mara" => process}}
              end)

              assert {:ok, observation} = LivingBriarRuntime.step(runtime)
              refute Map.has_key?(observation.populations, :transit)
              assert observation.populations.crossroads == 0

              summary = LivingBriarRuntime.snapshot(runtime)
              assert summary.resident_processes["mara"].body.id == "mara"
              assert abs(summary.material_accounting_error) < 1.0e-8

              LivingBriarRuntime.stop(runtime)
            end
          end
          ''')

          marker = Path('docs/agent_council/persistent_transit_working_note.md')
          if marker.exists():
              marker.unlink()
          PY
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'Make cross-region transit persistent [transit-applied]'
          git push origin HEAD:agent/persistent-transit
